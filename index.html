    <script>
      // Dim before first paint if it's already evening in London, so the page doesn't flash daylight.
      try {
        var h = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', hourCycle: 'h23' }).format(new Date()))
        var pref = localStorage.getItem('baring-lights')
        var candle = pref === 'candle' || (pref !== 'day' && (h >= 18 || h < 6))
        document.documentElement.dataset.light = candle ? 'candle' : 'day'
      } catch (e) {}
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <script>
    (() => {
      try {
        if (location.hash === '#me') localStorage.setItem('me', '1');
        if (localStorage.getItem('me') || sessionStorage.getItem('pinged')) return;
        sessionStorage.setItem('pinged', '1');
      } catch (e) {}
      const v = new URLSearchParams(location.search).get('v') || 'untagged';
      fetch('https://ntfy.sh/YOUR-NTFY-TOPIC', {
        method: 'POST', body: `${v} opened ${location.pathname}`, keepalive: true
      }).catch(() => {});
    })();
    </script>
  </body>
